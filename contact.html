<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Paulo Meyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-top">
      <a href="index.html" class="site-name">Paulo Meyer</a>
      <div class="role">Visual Designer</div>
      <p class="bio">Designing brand identities, e-commerce experiences and visual systems since 2009.</p>
      <div class="sb-meta">
        <span class="k">Based in</span><span>Rio de Janeiro, Brazil</span>
        <span class="k">Focus</span><span>Branding · E-Commerce · UX</span>
        <span class="k">Status</span><span>Available for freelance &amp; full-time</span>
      </div>
      <nav class="sb-nav">
        <a href="index.html#highlights">Highlights</a>
        <!-- <a href="index.html#ux">UX Case Study</a> -->
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="sb-bottom">
      <div class="stamp" aria-hidden="true">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <path id="circlePath" d="M80,80 m-68,0 a68,68 0 1,1 136,0 a68,68 0 1,1 -136,0" fill="none"/>
          <text><textPath href="#circlePath" startOffset="0%">PAULO MEYER · SINCE 2009 · VISUAL DESIGNER · </textPath></text>
          <circle class="dot" cx="80" cy="12" r="2.5"/>
        </svg>
      </div>
      <div class="socials">
        <a href="https://www.linkedin.com/in/paulo-meyer/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.behance.net/pxhx" target="_blank" rel="noopener">Behance</a>
      </div>
    </div>
  </aside>
  <main>

    <section style="margin-bottom:0;">
      <div class="section-head">
        <h2>Get in touch</h2>
      </div>
      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
        <input type="hidden" name="form-name" value="contact">
        <div style="display:none"><label>Skip this: <input name="bot-field"></label></div>

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Tell me about your project..."></textarea>
        </div>

        <button type="submit" class="btn">Send message →</button>
      </form>
    </section>

  </main>
</div>
<script src="js/script.js"></script>
</body>
</html>
